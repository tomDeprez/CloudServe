<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#cloudGradient)"/>

  <!-- Cloud Shape -->
  <path d="M 156 280
           Q 128 280, 128 253
           Q 128 213, 168 200
           Q 181 160, 221 160
           Q 248 133, 288 133
           Q 328 133, 355 160
           Q 395 160, 408 200
           Q 448 213, 448 253
           Q 448 280, 420 280
           Z"
        fill="white"
        opacity="0.95"
        stroke="none"/>

  <!-- Upload Arrow -->
  <g transform="translate(288, 240)">
    <rect x="-20" y="0" width="40" height="130" rx="10" fill="url(#arrowGradient)"/>
    <path d="M -64 48 L 0 -48 L 64 48 Z" fill="url(#arrowGradient)"/>
  </g>

  <!-- Small decorative dots -->
  <circle cx="200" cy="253" r="8" fill="white" opacity="0.6"/>
  <circle cx="332" cy="253" r="8" fill="white" opacity="0.6"/>
  <circle cx="288" cy="227" r="6" fill="white" opacity="0.5"/>
</svg>
